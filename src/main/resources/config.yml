# Default Configuration File

# Priorities:
# Coins: PlayerPoints, MySQL, Local
# Stats: MySQL, Local
# Local is the fallback method when something doesn't work
database:
  storage: "local" #mysql, local
  credentials:
    username: ''
    password: ''
    port: 3306
    database: ''
    dbUrl: 'localhost'

coins:
  use-playerpoints: false # If true it will override the storage and use the playerpoints API
  coins-per-win: 1

messages: # !DO NOT CHANGE PLACEHOLDERS!
  message-join: "&7Welcome to our minigame!"
  game-prefix: "&8|| &bGra&avity&7 &8| &R"
  welcome-title: "&fWelcome to &bGra&avity"
  queue-title: "&fYou are now in &e&nqueue"
  teleporting-error: "&7There was a problem teleporting you into the correct spawnpoint. Please report it to a server admin."
  greetings-playing: "&fThanks for playing!"
  game-winner: "&7The winner is &e&n{PLAYER}&R&7 with {TIME}&7s"
  winner-message: "&d{PLAYER} &efinished the game!"
  joined-lobby: "&d{PLAYER} &ejoined the lobby"
  actual-coins: "&eNow you have {COINS} coins."
  you-finished: "&7You've finished!"
  spectator-mode: "&cYou are now in spectator mode"
  kick-reason-1: "Game is still in progress"
  redirect-message: "&7You are being redirected to the Arcade Lobby!"
  compass-name: "&bIn game players"
  compass-displayname: "&aIn game Players"
  compass-lore-row1: ""
  compass-lore-row2: "&7What do you think about stalking"
  compass-lore-row3: "&7who is still in game?"
  click-to-teleport: "&7Click to teleport"
  player-not-online: "&cThe player is not online anymore."
  min-player-satisfied: "&7Number of minimum player satisfied!"
  min-player-no-more-satisfied: "&7Number of minimum player no more satisfied. &4Stopped &7countdown!"
  started-countdown: "&7Started &4countdown&7..."
  scoreboard:
    your-stats: "&e&lYour Stats:"
    ranking: "&3&lRanking:"
    waiting: "&f{NUMBER}#  Waiting..."

bungeecord:
  multi-server: false #true/false
  send-server: "" # Server name must coincide with your server written in config.yml of your bungeecord

max-players: 10
min-players: 2
maps-per-game: 5 # Number of Maps for each game
duration-time: 300 # Should be set in seconds
duration-prelobby: 10 # Should be set in seconds
lobbyspawn:
  spawnpoint:
    world: 0
    x: 0
    y: 0
    z: 0
    yaw: 0
    pitch: 0